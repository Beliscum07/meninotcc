mutation AdminAssignActivity($alunoId: UUID!, $atividadeId: UUID!)
  @auth(expr: "auth.token.admin == true")
  @transaction {
  query @redact {
    aluno(id: $alunoId) @check(expr: "this != null", message: "Aluno não encontrado.") {
      status @check(expr: "this == 'ativo'", message: "O cadastro do aluno está inativo.")
    }
    atividade(id: $atividadeId)
      @check(
        expr: "this != null && this.status == 'ativa' && this.inscricoes_on_atividade.size() < this.vagas",
        message: "Atividade indisponível ou sem vagas."
      ) {
      status @check(expr: "this == 'ativa'", message: "A atividade não está ativa.")
      vagas
      inscricoes_on_atividade(where: { status: { eq: "ativa" } }) {
        status
      }
    }
    inscricao(key: { alunoId: $alunoId, atividadeId: $atividadeId })
      @check(expr: "this == null", message: "O aluno já está inscrito nesta atividade.") {
      status
    }
  }
  inscricao_insert(
    data: { alunoId: $alunoId, atividadeId: $atividadeId, status: "ativa" }
  )
}

mutation AdminCreateScholarship(
  $nome: String!
  $descricao: String
  $valorMensal: Float!
) @auth(expr: "auth.token.admin == true && vars.valorMensal >= 0") {
  bolsa_insert(
    data: { nome: $nome, descricao: $descricao, valorMensal: $valorMensal }
  )
}

mutation AdminUpdateScholarship(
  $id: UUID!
  $nome: String!
  $descricao: String
  $valorMensal: Float!
  $ativa: Boolean!
) @auth(expr: "auth.token.admin == true && vars.valorMensal >= 0") {
  bolsa_update(
    id: $id
    data: {
      nome: $nome
      descricao: $descricao
      valorMensal: $valorMensal
      ativa: $ativa
    }
  )
}

mutation AdminAssignScholarship(
  $alunoId: UUID!
  $bolsaId: UUID!
  $valorConcedido: Float!
) @auth(
  expr: "auth.token.admin == true && vars.valorConcedido >= 0"
) @transaction {
  query @redact {
    aluno(id: $alunoId) @check(expr: "this != null", message: "Aluno não encontrado.") {
      status @check(expr: "this == 'ativo'", message: "O cadastro do aluno está inativo.")
    }
    bolsa(id: $bolsaId) @check(expr: "this != null", message: "Bolsa não encontrada.") {
      ativa @check(expr: "this == true", message: "A bolsa está inativa.")
    }
  }
  alunoBolsa_upsert(
    data: {
      alunoId: $alunoId
      bolsaId: $bolsaId
      valorConcedido: $valorConcedido
      status: "ativa"
    }
  )
}

