mutation RegisterDonorProfile($nome: String!, $telefone: String!)
  @auth(level: USER)
  @transaction {
  usuario_insert(
    data: {
      uid_expr: "auth.uid"
      nome: $nome
      email_expr: "auth.token.email"
      telefone: $telefone
      papel: "doador"
    }
  )
  doador_insert(data: { usuarioUid_expr: "auth.uid" })
}

mutation UpdateMyProfile($nome: String!, $telefone: String)
  @auth(expr: "auth != null && vars.nome != ''") {
  usuario_update(
    first: { where: { uid: { eq_expr: "auth.uid" } } }
    data: {
      nome: $nome
      email_expr: "auth.token.email"
      telefone: $telefone
    }
  )
}

mutation AdminCreateStudent(
  $nome: String!
  $idade: Int!
  $responsavel: String!
  $telefone: String!
  $email: String
  $presenca: Int!
) @auth(
  expr: "auth.token.admin == true && vars.idade >= 0 && vars.idade <= 120 && vars.presenca >= 0 && vars.presenca <= 100"
) {
  aluno_insert(
    data: {
      nome: $nome
      idade: $idade
      responsavel: $responsavel
      telefone: $telefone
      email: $email
      presenca: $presenca
    }
  )
}

mutation AdminUpdateStudent(
  $id: UUID!
  $nome: String!
  $idade: Int!
  $responsavel: String!
  $telefone: String!
  $email: String
  $presenca: Int!
) @auth(
  expr: "auth.token.admin == true && vars.idade >= 0 && vars.idade <= 120 && vars.presenca >= 0 && vars.presenca <= 100"
) {
  aluno_update(
    id: $id
    data: {
      nome: $nome
      idade: $idade
      responsavel: $responsavel
      telefone: $telefone
      email: $email
      presenca: $presenca
    }
  )
}

mutation AdminLinkStudentAccount(
  $studentId: UUID!
  $authUid: String!
  $authEmail: String!
) @auth(expr: "auth.token.admin == true") @transaction {
  query @redact {
    aluno(id: $studentId) @check(expr: "this != null", message: "Aluno não encontrado.") {
      usuarioUid @check(expr: "this == null", message: "Aluno já possui uma conta vinculada.")
      email @check(expr: "this == vars.authEmail", message: "O e-mail deve corresponder ao cadastro do aluno.")
      nome
      telefone
    }
    usuario(key: { uid: $authUid }) @check(expr: "this == null", message: "Esta conta já possui um perfil.") {
      uid
    }
  }
  usuario_insert(
    data: {
      uid: $authUid
      nome_expr: "response.query.aluno.nome"
      email: $authEmail
      telefone_expr: "response.query.aluno.telefone"
      papel: "aluno"
    }
  )
  aluno_update(id: $studentId, data: { usuarioUid: $authUid })
}

mutation AdminSetStudentStatus($id: UUID!, $status: String!)
  @auth(
    expr: "auth.token.admin == true && vars.status in ['ativo', 'inativo']"
  ) {
  aluno_update(id: $id, data: { status: $status })
}

mutation AdminCreateActivity(
  $nome: String!
  $professor: String!
  $descricao: String
  $horario: String
  $dias: String
  $vagas: Int!
  $categoria: String
) @auth(
  expr: "auth.token.admin == true && vars.vagas > 0 && vars.vagas <= 9999"
) {
  atividade_insert(
    data: {
      nome: $nome
      professor: $professor
      descricao: $descricao
      horario: $horario
      dias: $dias
      vagas: $vagas
      categoria: $categoria
    }
  )
}

mutation AdminUpdateActivity(
  $id: UUID!
  $nome: String!
  $professor: String!
  $descricao: String
  $horario: String
  $dias: String
  $vagas: Int!
  $categoria: String
  $status: String!
) @auth(
  expr: "auth.token.admin == true && vars.vagas > 0 && vars.vagas <= 9999 && vars.status in ['ativa', 'inativa']"
) {
  atividade_update(
    id: $id
    data: {
      nome: $nome
      professor: $professor
      descricao: $descricao
      horario: $horario
      dias: $dias
