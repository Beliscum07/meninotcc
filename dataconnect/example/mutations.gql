mutation AdminCreateNotification(
  $destinatarioUid: String!
  $titulo: String!
  $mensagem: String!
) @auth(expr: "auth.token.admin == true") {
  notificacao_insert(
    data: {
      destinatarioUid: $destinatarioUid
      titulo: $titulo
      mensagem: $mensagem
    }
  )
}

mutation MarkMyNotificationRead($id: UUID!) @auth(level: USER) {
  notificacao_update(
    first: {
      where: {
        id: { eq: $id }
        destinatarioUid: { eq_expr: "auth.uid" }
      }
    }
    data: { lida: true }
  )
}

mutation RegisterMyDonation($valor: Float!, $metodo: String)
  @auth(expr: "auth != null && vars.valor > 0")
  @transaction {
  query @redact {
    doadorParaDoacao: doador(
      first: { where: { usuarioUid: { eq_expr: "auth.uid" } } }
    ) @check(expr: "this != null", message: "Perfil de doador não encontrado.") {
      id
    }
  }
  doacao_insert(
    data: {
      doadorId_expr: "response.query.doadorParaDoacao.id"
      valor: $valor
      metodo: $metodo
      status: "pendente"
    }
  )
}

mutation AdminSetDonationStatus($id: UUID!, $status: String!)
  @auth(
    expr: "auth.token.admin == true && vars.status in ['pendente', 'recebida', 'cancelada']"
  ) {
  doacao_update(id: $id, data: { status: $status })
}
